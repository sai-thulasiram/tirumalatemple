name: Update bulletins

on:
  schedule:
    # Every 12 hours. TTD posts the previous day's bulletin in the morning IST.
    - cron: "45 4,16 * * *"   # 10:15 and 22:15 IST
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to keep filled in"
        default: "3"
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", "site.config.json", "docs/data/plan.json"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Parser tests
        run: python tests/test_parse.py
      - name: Install panchang library
        run: pip install ephem==4.2.1
      - name: Fetch bulletins
        run: python scripts/scrape.py --min-years "${{ github.event.inputs.years || '3' }}"
      - name: Build page
        run: python scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "bulletin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update bulletins $(date -u +%F)"
          git push
