name: Update bulletins

on:
  schedule:
    # Every 12 hours. TTD posts the previous day's bulletin in the morning IST.
    - cron: "45 4,16 * * *"   # 10:15 and 22:15 IST
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history to keep"
        default: "2"
  push:
    branches: [main]
    paths: ["src/**", "scripts/**", "site.config.json", "docs/data/plan.json"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Parser tests
        run: python tests/test_parse.py
      - name: Install panchang library
        run: pip install ephem==4.2.1
      - name: Fetch bulletins
        run: python scripts/scrape.py --min-years "${{ github.event.inputs.years || '2' }}"
      - name: Build page
        run: python scripts/build.py
      - name: Commit changes
        # Code pushes already include the built page; committing again here
        # would start a second Pages deploy that can cancel the first.
        if: github.event_name != 'push'
        run: |
          git config user.name "bulletin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update bulletins $(date -u +%F)"
          git push
      - name: Notify search engines (IndexNow)
        # Bing, Yandex and others pick up changed pages within hours.
        # Bing's index also feeds ChatGPT search and Microsoft Copilot.
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, urllib.request
          c = json.load(open("site.config.json"))
          url, key = c["siteUrl"].rstrip("/"), c.get("indexNowKey")
          if url and key:
              host = url.split("://", 1)[1]
              body = {"host": host, "key": key, "keyLocation": f"{url}/{key}.txt",
                      "urlList": [f"{url}/", f"{url}/today/", f"{url}/llms.txt", f"{url}/data/today.json"]}
              req = urllib.request.Request("https://api.indexnow.org/indexnow", json.dumps(body).encode(),
                                           {"Content-Type": "application/json; charset=utf-8"})
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status)
          EOF
